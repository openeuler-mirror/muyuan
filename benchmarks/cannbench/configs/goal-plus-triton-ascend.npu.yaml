goal_plus:
  driver: pi-rpc
  verifier: cann
  # Goal Plus owns candidate-level parallelism inside one operator. Candidate
  # coding sessions run concurrently; the CANN verifier serializes access to
  # this operator's assigned NPU through its npu:<device_id> resource lock.
  max_parallel: 4
  pi_binary: pi
  device_id: 0
  verify_timeout: 7200
  worker_budget:
    max_runtime_seconds: 3600
    min_runtime_seconds: 300
    min_verifier_runs: 1
    on_exceed: interrupt
  root_hypotheses:
    - build a correct Triton-Ascend baseline before tuning
    - optimize memory access and launch geometry without changing the public operator API
