[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-tool-online"
version = "1.0.0"
description = "Contracts, normalization, state graphs and validated runtime for BATE meta-tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "kkjocker"}
]
dependencies = ["jsonschema>=4.20,<5", "referencing>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bate = "bate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
