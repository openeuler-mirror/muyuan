[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-tool-online"
version = "1.0.0"
description = "Core contracts and runtime for generalized agent workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Independent reproduction"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
