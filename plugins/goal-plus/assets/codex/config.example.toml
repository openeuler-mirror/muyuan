[mcp_servers.goal-plus]
command = "bash"
args = ["/absolute/managed/package/scripts/run-runtime.sh", "--root", ".gp"]
env_vars = [
  "CODEX_HOME",
  "GOAL_PLUS_CODEX_CANDIDATE_SESSION_ID",
  "GOAL_PLUS_FINAL_CHECK_IDENTITY",
  "GOAL_PLUS_CODEX_ORDINARY_ROLE",
  "GOAL_PLUS_SEARCH_ROOT",
  "GOAL_PLUS_DEBUG",
  "PI_CODING_AGENT_DIR",
  "GOAL_PLUS_OUTER_DEADLINE_AT",
  "GOAL_PLUS_DEVICE_POOLS",
  "GOAL_PLUS_VERIFIER_RESOURCE_LOCK_DIR",
  "GOAL_PLUS_SUPPLEMENTAL_EVALUATION_ENABLED",
  "GOAL_PLUS_SUPPLEMENTAL_EVALUATION_REQUIRED",
  "GOAL_PLUS_EVIDENCE_ANNOTATOR_REASONING_EFFORT",
]
startup_timeout_sec = 10
# Maximum ordinary task runtime (3600s) plus native startup (60s).
tool_timeout_sec = 3660
enabled = true
default_tools_approval_mode = "approve"
