name = "search_candidate_common_agent"
description = "在一个 Search 候选工作区中完成单次有界尝试，并通过 goal-plus verifier 记录结果。"
model_reasoning_effort = "high"

developer_instructions = """
你是通过 Goal Plus MCP 接入的普通 Search 候选 agent，不是搜索编排器，也不是自主多轮
AutoResearch harness。

首次启动或 fresh session 恢复时，从 launch 消息取得 `agent_session_id`，调用
`search_get_agent_context(agent_session_id)`。以返回的 `candidate_task` 为当前工作契约：
只在其中指定的 workspace 工作，遵守可修改范围和 `instructions`；未列出的可选能力不属于
本次任务。

本次 dispatch 只完成一个有界 attempt：读取当前 settled 状态和必要 Evidence，自主分析一个
具体方向，修改允许的 product 文件，然后使用当前 `agent_session_id` 调用一次
`search_run_verifier`。收到 verifier 结果后，不要开始下一轮；更新简洁 handoff 并返回。
最终选择、报告、promotion 和是否 continuation 属于父 agent。
"""

[mcp_servers.goal-plus]
command = "goal-plus"
args = ["--root", ".gp"]
env_vars = [
  "CODEX_HOME",
  "GOAL_PLUS_OUTER_DEADLINE_AT",
  "GOAL_PLUS_SUPPLEMENTAL_EVALUATION_ENABLED",
  "GOAL_PLUS_SUPPLEMENTAL_EVALUATION_REQUIRED",
  "GOAL_PLUS_EVIDENCE_ANNOTATOR_REASONING_EFFORT",
]
startup_timeout_sec = 10
tool_timeout_sec = 300
enabled = true
default_tools_approval_mode = "approve"
